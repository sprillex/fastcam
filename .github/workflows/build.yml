name: Build RTSP Config APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build RTSP Config APK
        run: gradle :rtsp-config:assembleDebug :rtsp-config:assembleRelease

      - name: Upload RTSP Config Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rtsp-config-debug-apk
          path: rtsp-config/build/outputs/apk/debug/rtsp-config-debug.apk

      - name: Upload RTSP Config Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rtsp-config-release-apk
          path: rtsp-config/build/outputs/apk/release/rtsp-config-release-unsigned.apk
